name: Feature or client request
description: Suggest an improvement or ask for support in another AI agent.
labels: [enhancement]
body:
  - type: textarea
    id: request
    attributes:
      label: What would you like?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it matters
      description: The game or workflow this would help with.
